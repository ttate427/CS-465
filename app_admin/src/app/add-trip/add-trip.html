<div class="container mt-4">
  <h2>Add Trip</h2>

  <form (ngSubmit)="addTrip()" #tripForm="ngForm">

    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input
        type="text"
        class="form-control"
        name="code"
        [(ngModel)]="newTrip.code"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input
        type="text"
        class="form-control"
        name="name"
        [(ngModel)]="newTrip.name"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Length</label>
      <input
        type="text"
        class="form-control"
        name="length"
        [(ngModel)]="newTrip.length"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input
        type="text"
        class="form-control"
        name="start"
        [(ngModel)]="newTrip.start"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input
        type="text"
        class="form-control"
        name="resort"
        [(ngModel)]="newTrip.resort"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input
        type="text"
        class="form-control"
        name="perPerson"
        [(ngModel)]="newTrip.perPerson"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input
        type="text"
        class="form-control"
        name="image"
        [(ngModel)]="newTrip.image"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea
        class="form-control"
        name="description"
        rows="4"
        [(ngModel)]="newTrip.description"
        required
      ></textarea>
    </div>

    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="tripForm.invalid"
    >
      Add Trip
    </button>

  </form>

  <div
    class="alert alert-info mt-3"
    *ngIf="message"
  >
    {{ message }}
  </div>
</div>
