<div class="container mt-4">
  <h2>Edit Trip</h2>

  <form (ngSubmit)="updateTrip()">

    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input
        type="text"
        class="form-control"
        name="code"
        [(ngModel)]="trip.code"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input
        type="text"
        class="form-control"
        name="name"
        [(ngModel)]="trip.name"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Length</label>
      <input
        type="text"
        class="form-control"
        name="length"
        [(ngModel)]="trip.length"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input
        type="text"
        class="form-control"
        name="start"
        [(ngModel)]="trip.start"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input
        type="text"
        class="form-control"
        name="resort"
        [(ngModel)]="trip.resort"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input
        type="text"
        class="form-control"
        name="perPerson"
        [(ngModel)]="trip.perPerson"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Image</label>
      <input
        type="text"
        class="form-control"
        name="image"
        [(ngModel)]="trip.image"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea
        class="form-control"
        name="description"
        [(ngModel)]="trip.description"
        rows="4"
        required
      ></textarea>
    </div>

    <button type="submit" class="btn btn-primary">
      Save Changes
    </button>

    <button
      type="button"
      class="btn btn-secondary ms-2"
      (click)="cancel()"
    >
      Cancel
    </button>

  </form>
</div>
