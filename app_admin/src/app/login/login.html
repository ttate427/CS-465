<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-sm">
        <div class="card-body">

          <h2 class="mb-4">Admin Login</h2>

          <form (ngSubmit)="login()">

            <div class="mb-3">
              <label
                for="email"
                class="form-label"
              >
                Email
              </label>

              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                [(ngModel)]="email"
                required
              >
            </div>

            <div class="mb-3">
              <label
                for="password"
                class="form-label"
              >
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                [(ngModel)]="password"
                required
              >
            </div>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Login
            </button>

          </form>

          <div
            *ngIf="message"
            class="mt-3"
          >
            {{ message }}
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
