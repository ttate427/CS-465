<div class="container mt-4">
  <h2 class="mb-4">Trip Administration</h2>

  <p>Trips loaded: {{ trips.length }}</p>

  <div class="row">
    <div
      class="col-md-4 mb-4"
      *ngFor="let trip of trips"
    >
      <div class="card h-100 shadow-sm">

        <img
          class="card-img-top"
          [src]="'http://localhost:3000/images/' + trip.image"
          [alt]="trip.name"
        >

        <div class="card-body">

          <h5 class="card-title">
            {{ trip.name }}
          </h5>

          <p class="card-text">
            <strong>Code:</strong> {{ trip.code }}<br>
            <strong>Length:</strong> {{ trip.length }}<br>
            <strong>Start:</strong> {{ trip.start }}<br>
            <strong>Resort:</strong> {{ trip.resort }}<br>
            <strong>Price:</strong> {{ trip.perPerson }}
          </p>

          <p class="card-text">
            {{ trip.description }}
          </p>

          <button
            type="button"
            class="btn btn-warning"
            (click)="editTrip(trip.code)"
          >
            Edit Trip
          </button>

          <button
            type="button"
            class="btn btn-danger ms-2"
            (click)="deleteTrip(trip.code)"
          >
            Delete Trip
          </button>

        </div>

      </div>
    </div>
  </div>
</div>
